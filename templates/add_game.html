{% extends "base.html" %}

{% block title %}Add Game | Game Store Inventory{% endblock %}

{% block content %}
<section class="games-page">
    <h2>Add New Game</h2>

    <p class="dashboard-description">
        Add a new game to your store inventory.
    </p>

    <div class="form-container">
        {% if error %}
        <div class="form-error" role="alert">
            {{ error }}
        </div>
        {% endif %}
        <form method="POST" novalidate>
            <div class="form-group">
                <label for="title">Game Title</label>
                <input type="text" id="title" name="title" placeholder="e.g. Persona 5 Royal"
                    value="{{ form_data.get('title', '') if form_data is defined else '' }}" required>
            </div>

            <div class="form-group">
                <textarea id="description" name="description" rows="3"
                    placeholder="Enter a game description">{{ form_data.get('description', '') if form_data is defined else '' }}</textarea>
            </div>

            <div class="form-group">
                <input type="text" id="platform" name="platform" placeholder="e.g. PC"
                    value="{{ form_data.get('platform', '') if form_data is defined else '' }}" required>
            </div>

            <div class="form-group">
                <label for="stock_quantity">Stock Quantity</label>
                <input type="number" id="stock_quantity" name="stock_quantity" min="0" value="0" required>
            </div>

            <div class="form-group">
                <label for="buying_cost">Buying Cost (£)</label>
                <input type="number" id="buying_cost" name="buying_cost" min="0" max="99999999.99" step="0.01"
                    placeholder="e.g. 19.99" required>
            </div>

            <div class="form-group">
                <label for="selling_price">Selling Price (£)</label>
                <input type="number" id="selling_price" name="selling_price" min="0" max="99999999.99" step="0.01"
                    placeholder="e.g. 39.99" required>
            </div>


            <div class="form-group">
                <label for="publisher_id">Publisher</label>

                <select id="publisher_id" name="publisher_id" required>
                    <option value="">Select a publisher</option>

                    {% for publisher in publishers %}
                    <option value="{{ publisher[0] }}">
                        {{ publisher[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>


            <button type="submit" class="primary-button">
                Add Game
            </button>
        </form>
    </div>
</section>
{% endblock %}
