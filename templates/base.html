<!DOCTYPE html>
<html lang="en" <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}Game Store Inventory{% endblock %}</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">
            <div class="sidebar-brand">
                <h1>🎮 Game Store</h1>
                <p>Inventory Manager</p>
            </div>

            <nav aria-label="Main navigation">
                <a href="{{ url_for('home') }}" class="nav-link active">
                    Dashboard
                </a>

                <span class="nav-link nav-placeholder">Games</span>
                <span class="nav-link nav-placeholder">Inventory</span>
                <span class="nav-link nav-placeholder">publishers</span>
            </nav>
        </aside>

        <div class="content-wrapper">
            <header class="topbar">
                <h2>Store Management</h2>
            </header>

            <main>
                {% block content %}
                {% endblock %}
            </main>

            <footer>
                <p>Game Store Inventory Manager 2.0</p>
            </footer>
        </div>

    </div>

</body>

</html>
