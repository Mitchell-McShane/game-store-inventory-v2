{% extends "base.html" %}

{% block content %}
<section class="games-page">
    <h1>Edit Game</h1>
    <p>Update the information for {{ game[1] }}.</p>

    <div class="form-container">
        <form method="POST">

            <div class="form-group">
                <label for="title">Game Title</label>
                <input type="text" id="title" name="title" value="{{ game[1] }}" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3"
                    placeholder="Enter a game description">{{ game[2] or '' }}</textarea>
            </div>


            <div class="form-group">
                <label for="platform">Platform</label>
                <input type="text" id="platform" name="platform" value="{{ game[3] }}" required>
            </div>

            <div class="form-group">
                <label for="stock_quantity">Stock Quantity</label>
                <input type="number" id="stock_quantity" name="stock_quantity" min="0" value="{{ game[4] }}" required>
            </div>

            <div class="form-group">
                <label for="buying_cost">Buying Cost (£)</label>
                <input type="number" id="buying_cost" name="buying_cost" min="0" max="99999999.99" step="0.01"
                    value="{{ game[5] }}" required>
            </div>

            <div class="form-group">
                <label for="selling_price">Selling Price (£)</label>
                <input type="number" id="selling_price" name="selling_price" min="0" max="99999999.99" step="0.01"
                    value="{{ game[6] }}" required>
            </div>

            <div class="form-group">
                <label for="publisher_id">Publisher</label>
                <select id="publisher_id" name="publisher_id" required>
                    <option value="">Select a publisher</option>

                    {% for publisher in publishers %}
                    <option value="{{ publisher[0] }}" {% if publisher[0]==game[7] %} selected {% endif %}>
                        {{ publisher[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="primary-button">
                Save Changes
            </button>

        </form>
    </div>
</section>
{% endblock %}
